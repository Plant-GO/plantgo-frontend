name: plantgo
description: "A plant identification and map exploration app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # State Management
  provider: ^6.1.2

  # Maps (OSM - No API key required!)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.0

  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+5
  flutter_image_compress: ^2.1.0
  
  # Networking
  http: ^1.2.0
  
  # Environment Config
  flutter_dotenv: ^5.1.0
  
  # Device & Storage
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

  # Blockchain / Wallet
  url_launcher: ^6.2.4       # Deep link handling for Phantom
  app_links: ^6.3.0          # Universal links for wallet callback
  solana: ^0.31.0            # Solana SDK for transaction building
  pinenacl: ^0.6.0           # NaCl encryption for Phantom v1 protocol
  bs58: ^1.0.2               # Proven Base58 encoding for Solana compatibility
  
  # UI Enhancements for NFT Cards
  shimmer: ^3.0.0            # Shimmer effects for loading/cards
  lottie: ^3.1.0             # Success animations
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/
